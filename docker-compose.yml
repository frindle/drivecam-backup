services:
  drivecam-web:
    image: ghcr.io/frindle/drivecam-backup/drivecam-web:latest
    container_name: drivecam-web
    ports:
      - "8000:8000"
    volumes:
      - /mnt/user/data/Media/Drivecam:/data
      - drivecam-cache:/tmp
    environment:
      - DATA_PATH=/data
      - SHARE_PATH=/data
      - STATIC_PATH=/app/backend/static
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  drivecam-cache: